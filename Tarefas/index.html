<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cabecalho">
        <h1 id="titulo-principal"><span>Tarefas</span></h1>
        <p>Clique para marcar uma tarefa como concluída</p>
    </div>
    <div class="conteudo">
        <div class="inscricao">
            <h2>Tarefas</h2>

            <!-- Formulário -->
            <form>
                <label for="Nova tarefa">Nova tarefa:</label>
                <input type="text" id="Nova tarefa" placeholder="Digite sua nova tarefa">
                <button type="submit">Adicionar tarefa</button>
                <br>
                <br>
                <input type="checkbox" id="Estudar">
                <label for="Estudar">Estudar git</label>
                <br>

                <input type="checkbox" id="Branch">
                <label for="Branch">Criar Branch</label>
                <br>

                <input type="checkbox" id="Ler">
                <label for="Ler">Ler livro de HTML</label>
                <br>
                <br>


            </form>
        </div>
    </div>
    <div class="rodape">
        <p>Marcar Tarefas - <span>2026</span></p>



    </div>
</body>

</html>
