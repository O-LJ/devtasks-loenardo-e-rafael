<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
</head>
<body>

    <h1>Usuários</h1>
    <hr>

    <!-- Formulário de cadastro -->
    <div>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite o e-mail"><br><br>

        <button>Adicionar usuário</button>
    </div>

    <br><hr>

    <!-- Lista de usuários cadastrados -->
    <h2>Usuários cadastrados:</h2>
    <ul>
        <li><strong>Ana</strong> - ana@email.com</li>
        <li><strong>Carlos</strong> - carlos@email.com</li>
        <li><strong>Marina</strong> - marina@email.com</li>
    </ul>

</body>
</html>
